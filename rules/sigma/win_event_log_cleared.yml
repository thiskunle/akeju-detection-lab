title: Windows event log cleared with wevtutil
id: 1a7d5f93-8b2e-4e36-b6c4-3f9e2d7a1c06
status: experimental
description: Clearing event logs removes the evidence defenders depend on.
author: Adekunle Akeju
date: 2026-11-08
tags:
    - attack.t1070.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith: '\wevtutil.exe'
    selection_clear:
        CommandLine|contains:
            - ' cl '
            - ' clear-log '
    condition: all of selection_*
falsepositives:
    - Rare administrator maintenance
level: high
